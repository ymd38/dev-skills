# Generated by dev-skills harness. Adjust working-directory per job for monorepos.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [{{DEFAULT_BRANCH}}]
    paths:
{{CI_PATHS}}
      - '.github/workflows/ci.yml'
  # Direct pushes to the default branch are scanned too (bypass coverage).
  push:
    branches: [{{DEFAULT_BRANCH}}]
    paths:
{{CI_PATHS}}
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
{{CI_JOBS}}
